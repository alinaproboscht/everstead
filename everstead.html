<html lang="de">

<style>
:root{--bg:#e9ebe1;--panel:#f7f8f2;--ink:#22281f;--muted:#5f6857;--line:#cfd4c2;--acc:#9a6b12;--accink:#fff;--ok:#4a9a52;--warn:#d69a2a;--bad:#c0503a;--chip:#e3e7d8;--glass:rgba(247,248,242,.94)}

:root[data-theme="dark"]{--bg:#141a16;--panel:#1d2520;--ink:#ecebdf;--muted:#9da896;--line:#34413a;--acc:#d8b04a;--accink:#1d2520;--chip:#26302a;--glass:rgba(29,37,32,.94)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Alegreya Sans",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.4;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
#app{height:100%;display:flex;flex-direction:column}
#hud{background:var(--panel);border-bottom:1px solid var(--line);padding:6px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;z-index:4}
.clock{display:flex;flex-direction:column;line-height:1.1;min-width:92px}
.clock b{font-family:"Alegreya",Georgia,serif;font-size:1.2rem;font-variant-numeric:tabular-nums}
.clock span{font-size:.8rem;color:var(--muted)}
#res{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;flex:1 1 260px;order:3}
@media(min-width:620px){#res{order:0}}
#res::-webkit-scrollbar{display:none}
.chip{background:var(--chip);border-radius:999px;padding:3px 9px;font-size:.88rem;white-space:nowrap}
.chip b{font-variant-numeric:tabular-nums}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-left:auto}
.seg button{background:transparent;border:0;min-width:40px;min-height:36px;padding:0 6px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--accink);font-weight:700}
#main{flex:1;min-height:0;display:flex;position:relative}
#mapwrap{flex:1;position:relative;overflow:hidden;min-width:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.float{position:absolute;z-index:3}
#tools{left:10px;bottom:12px;display:flex;flex-direction:column;gap:8px}
#tools button,#zoom button{width:52px;height:52px;border-radius:16px;border:1px solid var(--line);background:var(--glass);font-size:1.35rem;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.18)}
#tools button[aria-pressed="true"]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
#tools button small{display:none}
#zoom{right:10px;top:10px;display:flex;flex-direction:column;gap:8px}
#zoom button{width:44px;height:44px;font-size:1.3rem}
#zoom button[aria-pressed="true"]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
#feed{right:62px;top:10px;display:flex;flex-direction:column;gap:6px;max-width:min(300px,62vw);align-items:flex-end}
.fi{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:.86rem;text-align:left;box-shadow:0 2px 8px rgba(0,0,0,.15);transition:opacity .6s,transform .6s}
.fi.out{opacity:0;transform:translateX(20px)}
#ctrlbar{left:72px;right:62px;top:10px;background:var(--glass);border:2px solid var(--acc);border-radius:14px;padding:8px 10px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#ctrlbar .top{display:flex;align-items:center;gap:8px}
#ctrlbar .top>div{flex:1;min-width:0}
#ctrlname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:block;font-family:"Alegreya",Georgia,serif;font-weight:700;font-size:1.05rem;background:none;border:0;padding:0;text-align:left}
#ctrlstate{font-size:.85rem;color:var(--muted);display:block}
#ctrlbar .q{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px}
#ctrlbar .q button{min-width:0;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:2px;font-size:.74rem;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
#ctrlbar .q button b{font-size:1.1rem;font-weight:400}
#ctrlbar .end{margin-left:auto;background:var(--acc);color:var(--accink);border:0;border-radius:10px;min-height:36px;padding:0 12px;font-weight:700}
#ctrlbar .hint{font-size:.78rem;color:var(--muted);margin:4px 0 0}
#ctrlstate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ctxbar{right:10px;bottom:12px;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 4px 14px rgba(0,0,0,.2);max-width:calc(100% - 84px)}
#ctxname{font-size:.85rem;color:var(--muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ctxbar .b{display:flex;gap:6px}
#ctxbar button{width:48px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.2rem;line-height:1}
#ctxbar button span{font-size:.62rem;margin-top:3px;color:var(--muted)}
#ctxbar button.on{border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
#ctxbar button.main{background:var(--acc);color:var(--accink);border-color:var(--acc)}
#ctxbar button.main span{color:var(--accink)}
#modehint{left:72px;right:10px;bottom:12px;background:var(--glass);border:2px solid var(--acc);border-radius:14px;padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#mhtext{flex:1 1 160px;font-size:.92rem}
#modehint button{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:0 12px}
#modehint .okb{background:#2f8a4a;color:#fff;border:0;font-weight:700}
#modehint #mhdone{background:transparent}
#panel{position:absolute;left:0;right:0;bottom:0;max-height:62%;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;display:flex;flex-direction:column;z-index:5;box-shadow:0 -8px 24px rgba(0,0,0,.25)}
#panel[hidden]{display:none}
#phead{display:flex;align-items:center;gap:8px;padding:12px 16px 6px}
#phead h2{flex:1;margin:0;font-family:"Alegreya",Georgia,serif;font-size:1.3rem;line-height:1.2}
#pclose{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:transparent;font-size:1.1rem}
#pbody{overflow-y:auto;padding:0 16px 16px;-webkit-overflow-scrolling:touch;-webkit-user-select:text;user-select:text}
@media(min-width:820px){
 #panel{position:static;width:380px;max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--line);box-shadow:none}
 #panel[hidden]{display:flex!important}#pclose{display:none}
 #tools button{width:64px;height:60px;font-size:1.3rem}#tools button small{display:block;font-size:.66rem;color:inherit;opacity:.8}
 #tools button{display:flex;flex-direction:column;align-items:center;justify-content:center}
}
h3{font-family:"Alegreya",Georgia,serif;font-size:1.05rem;margin:14px 0 6px}
.hint{color:var(--muted);font-size:.9rem}
.sub{color:var(--muted);font-size:.88rem;margin:2px 0}
.doing{background:var(--chip);border-radius:12px;padding:8px 10px;margin:8px 0}
.doing i{color:var(--muted)}
.needs{display:grid;gap:5px}
.needs label{display:grid;grid-template-columns:96px 1fr;align-items:center;font-size:.88rem}
.bar{display:block;height:8px;background:var(--chip);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0;font-size:.92rem;align-items:center}
.kv>span:nth-child(odd){color:var(--muted)}
.link{background:none;border:0;padding:0;color:var(--acc);text-decoration:underline;text-align:left;font-weight:500}
.subtabs{display:flex;gap:6px;margin:4px 0 10px}
.st{flex:1;min-height:38px;border-radius:10px;border:1px solid var(--line);background:transparent;font-weight:500}
.st.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.seg3{display:flex;gap:6px}.seg3 button{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:.86rem}
.seg3 button.on{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}

.list{list-style:none;margin:0;padding:0;display:grid;gap:4px}

.list li.row{display:flex;gap:4px}.list li.row>button:first-child{flex:1}
.list .nm{font-weight:500}
.mini{width:44px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:1.1rem}
.memo{list-style:none;margin:0;padding:0;font-size:.88rem}.memo li{padding:5px 0;border-bottom:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.stats div{background:var(--chip);border-radius:12px;padding:8px 4px;text-align:center}.stats b{display:block;font-size:1.25rem;font-family:"Alegreya",Georgia,serif}.stats span{font-size:.74rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.bb{min-height:86px;border-radius:12px;border:1px solid var(--line);background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px;text-align:center}
.bb.poor{opacity:.55}.bb .ic{font-size:1.5rem}.bb .nm{font-size:.86rem;font-weight:500}.bb .co{font-size:.74rem}
.bb .sw{width:36px;height:14px;border-radius:4px;margin:6px 0}
.cost.miss{color:var(--bad);font-weight:700}
.prev{display:block;width:100%;height:170px;background:linear-gradient(#cfe1ea,#e9f0e0);border-radius:12px;margin:8px 0}

#sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:8;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.sh{background:var(--panel);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;max-height:75%;overflow-y:auto}
.sh h3{margin:0 0 4px}.sh button{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--chip);text-align:left;padding:0 14px;font-size:1rem}
.sh .cancel{background:transparent;text-align:center}

#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9;display:flex;align-items:center;justify-content:center;padding:12px}
#modal[hidden]{display:none}
#mbox{background:var(--panel);border-radius:18px;padding:16px;width:100%;max-width:480px;max-height:92%;overflow-y:auto}
#mbox h2{font-family:"Alegreya",Georgia,serif;margin:0 0 8px}
.fld{display:grid;gap:4px;font-size:.9rem;color:var(--muted);margin:8px 0}
.fld input{font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:10px;-webkit-user-select:text;user-select:text}
.stepper{display:flex;align-items:center;gap:12px}.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--chip);font-size:1.3rem}
.sws{display:flex;gap:8px;flex-wrap:wrap}.sws button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line)}.sws button.on{border:3px solid var(--acc);box-shadow:0 0 0 2px var(--panel) inset}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.mact button{min-height:46px;border-radius:12px;border:1px solid var(--line);background:transparent;padding:0 16px}
.mact .pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}
.eras{display:grid;gap:6px}.eras button{display:grid;text-align:left;border-radius:12px;border:1px solid var(--line);background:var(--chip);padding:10px 12px}.eras button.on{border:2px solid var(--acc)}.eras span{font-size:.85rem;color:var(--muted)}

#ed{position:fixed;inset:0;z-index:7;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.edh{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}

.edt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}

#edfl{display:flex;gap:6px;padding:6px 10px;overflow-x:auto}

#edwrap{flex:1;min-height:0;position:relative}
#edcv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#edinfo{background:var(--panel);border-top:1px solid var(--line);padding:8px 12px;font-size:.9rem;height:104px;overflow-y:auto;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;align-content:center}

.acts .pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}

.phead{display:flex;gap:12px;align-items:center;margin:2px 0 10px}
.pname{font-family:"Alegreya",Georgia,serif;font-size:1.3rem;font-weight:700;line-height:1.15}

function genMap(seed){

// ===== Wegfindung (A*) =====
let PG=new Float32Array(W*H),PC=new Int32Array(W*H),PS=new Int32Array(W*H),PCL=new Int32Array(W*H);
function allocWorld(w,h){W=w;H=h;occ=new Int32Array(W*H);PG=new Float32Array(W*H);PC=new Int32Array(W*H);PS=new Int32Array(W*H);PCL=new Int32Array(W*H);pcache.clear()}let pstamp=0,pathCalls=0;const pcache=new Map();
function tcost(i){const r=S.road[i];return r?1/ROADS[r].sp:1/TSP[S.map[i]]}

function findPath(from,to){
 if(from===to)return[];const key=from*2048+to;if(pcache.has(key))return pcache.get(key);
 if(pathCalls>=30)return null;pathCalls++;pstamp++;
 const hf=[],hi=[];
 const push=(f,i)=>{let k=hf.length;hf.push(f);hi.push(i);while(k>0){const p=(k-1)>>1;if(hf[p]<=f)break;hf[k]=hf[p];hi[k]=hi[p];k=p}hf[k]=f;hi[k]=i};
 const pop=()=>{const top=hi[0],lf=hf.pop(),li=hi.pop(),n=hf.length;if(n){let k=0;for(;;){let l=2*k+1;if(l>=n)break;const q=l+1;if(q<n&&hf[q]<hf[l])l=q;if(hf[l]>=lf)break;hf[k]=hf[l];hi[k]=hi[l];k=l}hf[k]=lf;hi[k]=li}return top};
 const tx=to%W,ty=(to/W)|0,hm=1/2.1;PG[from]=0;PS[from]=pstamp;PC[from]=-1;push(0,from);let found=false;
 while(hf.length){const i=pop();if(PCL[i]===pstamp)continue;PCL[i]=pstamp;if(i===to){found=true;break}const x=i%W,y=(i/W)|0;
  for(let k=0;k<4;k++){const nx=x+(k===0?1:k===1?-1:0),ny=y+(k===2?1:k===3?-1:0);if(nx<0||ny<0||nx>=W||ny>=H)continue;const j=ny*W+nx;if(PCL[j]===pstamp)continue;
   if(S.map[j]===3&&j!==to&&!S.road[j])continue;if(occ[j]&&j!==to)continue;if(S.hgt&&Math.abs((S.hgt[j]||0)-(S.hgt[i]||0))>=1&&!(S.road[i]&&S.road[j]))continue;
   const g=PG[i]+tcost(j);if(PS[j]!==pstamp||g<PG[j]){PS[j]=pstamp;PG[j]=g;PC[j]=i;push(g+(Math.abs(nx-tx)+Math.abs(ny-ty))*hm,j)}}}
 let path=false;if(found){path=[];let i=to;while(i!==from){path.push(i);i=PC[i]}path.reverse()}
 if(pcache.size>4000)pcache.clear();pcache.set(key,path);return path;
}

// Orte & Ziele

function start(s,task){

 const L=task.tid?(()=>{const p=pById.get(task.tid);if(!p)return null;if(p.inside)return{x:bById.get(p.inside).x,y:bById.get(p.inside).y,b:bById.get(p.inside)};return{x:Math.floor(p.x),y:Math.floor(p.y)}})():locOf(task);

  case 'buy':{if(S.res.brot<1){s.th='Kein Brot mehr da!';s.left=.1;break}const pz=bp(),q=Math.min(S.res.brot,Math.floor(s.money/pz),s.tr.includes('sparsam')?3:5);
   if(q<1){s.th='Ich habe kein Geld.';s.left=.1;break}S.res.brot-=q;s.money-=q*pz;pf(s,'exp',q*pz);S.res.taler+=q*pz;flow('in','Brotverkauf',q*pz);{const fee=Math.min(s.money,q*pz*(S.mfee==null?.1:S.mfee));if(fee>0){s.money-=fee;pf(s,'exp',fee);S.res.taler+=fee;flow('in','Marktstandgeld',fee)}}flow('cons','brot',q);s.brot+=q;s.th=`${q} Brote gekauft.`;mem(s,`hat ${q} Brote gekauft`);s.left=.25;

 for(const c of S.p)if(c.parents.includes(s.id))story(c,'🖤',`verlor ${s.g==='f'?'die Mutter':'den Vater'} ${s.fn}`);

const SAVE_DB='everstead',SAVE_STORE='saves';let SAVE_INFO={ok:null,size:0,where:'',t:0,warned:false},_saving=false;
function serializeState(){const strip=o=>{const r={};for(const k in o){if(k[0]==='_'||k==='path'||k==='talk')continue;r[k]=o[k]}return r};
 const d={...S,savedAt:Date.now(),p:S.p.map(strip),b:S.b.map(strip),dead:(S.dead||[]).map(x=>({...strip(x),story:(x.story||[]).slice(-15),convs:undefined,em:undefined,wish:undefined}))};
 if(d.explore&&Array.isArray(d.explore.known))d.explore={...d.explore,known:d.explore.known.join('')};delete d.fl;return JSON.stringify(d)}

async function gz(str){if(!window.CompressionStream)return null;const s=new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'));return new Uint8Array(await new Response(s).arrayBuffer())}
async function ungz(buf){const s=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(s).text()}

 let lsOK=false;try{if(json.length<4.5e6){localStorage.setItem(KEY,json);lsOK=true}else localStorage.removeItem(KEY)}catch(e){}if(lsOK){ok=true;where.push('Browser')}
 try{const z=await gz(json);const db=await idbOpen();await new Promise((res,rej)=>{const tx=db.transaction(SAVE_STORE,'readwrite');tx.objectStore(SAVE_STORE).put(z?{z:1,data:z,t:Date.now()}:{z:0,data:json,t:Date.now()},KEY);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});ok=true;where.push('Datenbank');if(z)size=z.length}catch(e){}
 SAVE_INFO={ok,size,where:where.join(' + '),t:Date.now(),warned:SAVE_INFO.warned};if(!ok&&!SAVE_INFO.warned){SAVE_INFO.warned=true;if(typeof toast==='function')toast('⚠ Speichern fehlgeschlagen – bitte unter 📜 Chronik den Spielstand exportieren!')}_saving=false}
